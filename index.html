<!DOCTYPE html>
<html>
<head>
    <title>Personal Profile Card</title>

    <style>
        body {
            background-color: #e8efff;
            font-family: Arial;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .card {
            background-color: white;
            width: 380px;
            padding: 30px;
            margin: 20px;
            border: 3px solid #4b6cff;
            border-radius: 25px;
            text-align: center;
            box-sizing: border-box;
            box-shadow: 0 5px 20px #aaa;
        }

        img {
            width: 200px;
            height: 200px;
            border-radius: 50%;
            border: 5px solid #4b6cff;
            object-fit: cover;
        }

        h1 {
            color: #304fc0;
            font-size: 28px;
        }

        p {
            color: #555;
            line-height: 1.7;
            font-size: 16px;
        }

        h3 {
            color: #304fc0;
        }

        ul {
            list-style-position: inside;
            padding: 0;
            color: #333;
        }

        li {
            margin: 12px;
        }
    </style>
</head>

<body>

    <div class="card">

        <img src="c:\Users\mahmo\Pictures\Screenshots\images.jpg"
             alt="Profile Photo">

        <h1>Abdullah</h1>

        <p>
            Hello! My name is Abdullah.
            I love learning programming
            and playing games.
        </p>

        <h3>My Hobbies</h3>

        <ul>
            <li>Gaming</li>
            <li>Programming</li>
            <li>Football</li>
            <li>Learning new things</li>
        </ul>

    </div>

</body>
</html>
